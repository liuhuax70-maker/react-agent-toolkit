<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReAct 智能体</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f8f8f7; --panel-hover:#efefed; --elev:#ffffff;
    --border:#e7e7e4; --border-strong:#d8d8d4;
    --text:#1b1b19; --text-2:#63635d; --text-3:#9b9b94;
    --accent:#5b5bd6; --accent-soft:#eeeefb; --accent-ink:#3f3fb0;
    --ok:#2f7a4f; --ok-soft:#eef6f0; --err:#b3261e; --err-soft:#fcefee;
    --r:10px; --r-sm:7px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171715; --panel:#1c1c1a; --panel-hover:#242422; --elev:#1c1c1a;
      --border:#2c2c29; --border-strong:#3a3a36;
      --text:#ececea; --text-2:#a5a59e; --text-3:#77776f;
      --accent:#8f8ff0; --accent-soft:#232340; --accent-ink:#b9b9f7;
      --ok-soft:#1b2a20; --err-soft:#2b1c1c;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
  .app{display:grid;grid-template-columns:264px 1fr;height:100vh}

  .sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
  .brand{display:flex;align-items:center;gap:9px;padding:16px 16px 14px}
  .brand .mark{width:22px;height:22px;color:var(--accent)}
  .brand b{font-size:14px;font-weight:500}
  .side-label{font-size:11.5px;color:var(--text-3);padding:10px 16px 4px}
  .tools{flex:1;overflow-y:auto;padding:0 10px 8px}
  .tool{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:var(--r-sm);font-size:12.5px;color:var(--text-2)}
  .tool:hover{background:var(--panel-hover);color:var(--text)}
  .tool .ic{width:13px;height:13px;flex:none;margin-top:2px;color:var(--text-3)}
  .tool code{font-family:var(--mono);font-size:12px}
  .side-foot{border-top:1px solid var(--border);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
  .foot-txt{font-size:11.5px;color:var(--text-3);display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
  .linkbtn{font-size:11.5px;color:var(--text-3);background:none;border:none;cursor:pointer;font-family:inherit;padding:2px 4px;border-radius:5px}
  .linkbtn:hover{color:var(--err);background:var(--panel-hover)}

  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{height:50px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
  .topbar h1{font-size:13.5px;font-weight:500;margin:0;color:var(--text-2)}
  .thread{flex:1;overflow-y:auto}
  .wrap{max-width:760px;margin:0 auto;padding:26px 24px 8px}

  .welcome{padding:56px 0 0;text-align:center}
  .welcome .mark{width:30px;height:30px;color:var(--accent);opacity:.9}
  .welcome h2{font-size:16px;font-weight:500;margin:14px 0 6px}
  .welcome p{font-size:13px;color:var(--text-3);margin:0 0 20px}
  .examples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .example{font-family:inherit;font-size:13px;color:var(--text-2);background:var(--elev);border:1px solid var(--border);border-radius:999px;padding:7px 13px;cursor:pointer;transition:.12s}
  .example:hover{border-color:var(--border-strong);color:var(--text)}

  .msg{margin-bottom:24px}
  .msg.user{display:flex;justify-content:flex-end}
  .msg.user .body{background:var(--panel);border:1px solid var(--border);border-radius:10px 10px 2px 10px;padding:9px 13px;max-width:82%;white-space:pre-wrap;line-height:1.7}
  .msg.bot .who{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);margin-bottom:8px}
  .msg.bot .who .ic{width:13px;height:13px;color:var(--accent)}

  .trace{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
  .trace-head{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--panel);font-size:11.5px;color:var(--text-3);cursor:pointer;user-select:none}
  .trace-head .ic{width:12px;height:12px}
  .trace-body{padding:8px 10px;display:flex;flex-direction:column;gap:8px}
  .trace.collapsed .trace-body{display:none}
  .step{border-left:2px solid var(--border);padding-left:10px}
  .step-think{font-size:12.5px;color:var(--text-3);line-height:1.7;white-space:pre-wrap;margin-bottom:6px}
  .step-think:empty{display:none}
  .call{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;margin-top:4px}
  .chip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:3px 8px;border:1px solid var(--border);background:var(--elev);color:var(--text-2)}
  .chip code{font-family:var(--mono);font-size:11.5px}
  .chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
  .chip.err{background:var(--err-soft);border-color:transparent;color:var(--err)}
  .chip .ic{width:11px;height:11px}
  .result{font-size:12px;color:var(--text-3);font-family:var(--mono);white-space:pre-wrap;word-break:break-all;margin-top:3px;max-height:110px;overflow:auto}

  .answer{line-height:1.8;white-space:pre-wrap}
  .answer.pending::after{content:"";display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2,start) infinite}
  @keyframes blink{to{visibility:hidden}}
  .msg.bot.err .answer{color:var(--err)}

  .composer{border-top:1px solid var(--border);padding:12px 24px 16px}
  .box{max-width:760px;margin:0 auto;border:1px solid var(--border-strong);border-radius:var(--r);background:var(--elev);padding:10px 10px 8px;transition:border-color .12s,box-shadow .12s}
  .box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{width:100%;border:none;background:none;resize:none;font-family:inherit;font-size:14px;color:var(--text);line-height:1.65;outline:none;max-height:160px;padding:2px 4px}
  textarea::placeholder{color:var(--text-3)}
  .box-foot{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 0}
  .hint{font-size:11.5px;color:var(--text-3)}
  .send{font-family:inherit;font-size:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .send:hover{background:var(--accent-ink)}
  .send[disabled]{opacity:.5;cursor:not-allowed}
  .send .ic{width:13px;height:13px}

  #toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:9}
  .toast{background:var(--elev);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:9px 13px;font-size:13px;box-shadow:0 4px 14px rgba(20,20,18,.10);opacity:0;transform:translateY(6px);transition:.18s}
  .toast.in{opacity:1;transform:none}
  .toast.err{border-left:3px solid var(--err)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px;border:3px solid var(--bg)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="7" width="16" height="11" rx="2.5"/><path d="M12 4v3"/><circle cx="9" cy="12.5" r="1"/><circle cx="15" cy="12.5" r="1"/>
      </svg>
      <b>ReAct 智能体</b>
    </div>
    <div class="side-label">可用工具</div>
    <div class="tools" id="tools"></div>
    <div class="side-foot">
      <span class="foot-txt"><span class="dot"></span><span id="sysInfo">连接中…</span></span>
      <button class="linkbtn" id="resetBtn">清空对话</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>自主规划 · 调用工具 · 多步推理</h1>
    </div>

    <div class="thread" id="thread">
      <div class="wrap" id="welcome">
        <div class="welcome">
          <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="7" width="16" height="11" rx="2.5"/><path d="M12 4v3"/><circle cx="9" cy="12.5" r="1"/><circle cx="15" cy="12.5" r="1"/>
          </svg>
          <h2>交给它一个需要多步完成的任务</h2>
          <p>它会自主判断、调用工具、根据结果继续推理，并把工具调用过程展示出来。</p>
          <div class="examples">
            <button class="example">计算 (128 + 372) * 15 / 4 是多少</button>
            <button class="example">现在几点？顺便把结果写进 note.txt</button>
            <button class="example">统计这句话的词数：今天天气很好，适合出门散步</button>
          </div>
        </div>
      </div>
      <div class="wrap" id="msgs" style="padding-top:0"></div>
    </div>

    <div class="composer">
      <div class="box">
        <textarea id="q" rows="1" placeholder="描述一个需要多步完成的任务…"></textarea>
        <div class="box-foot">
          <span class="hint">Enter 发送 · Shift+Enter 换行</span>
          <button class="send" id="sendBtn" disabled>
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13"/><path d="m12 5 7 7-7 7"/></svg>
            发送
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const thread = $("thread"), msgs = $("msgs");
const q = $("q"), sendBtn = $("sendBtn");
let streaming = false;
let welcome = $("welcome");

const ICON_TOOL = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5L21 12l-9 9-3-3 9-9z"/><path d="M7 7l3 3"/></svg>';
const ICON_BOT = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="11" rx="2.5"/><path d="M12 4v3"/><circle cx="9" cy="12.5" r="1"/><circle cx="15" cy="12.5" r="1"/></svg>';
const ICON_TRACE = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h7"/></svg>';
const ICON_OK = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-9"/></svg>';
const ICON_ERR = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

function fmt(text) {
  const safe = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return safe.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

function toast(text, kind = "ok") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = text;
  $("toast").appendChild(el);
  requestAnimationFrame(() => el.classList.add("in"));
  setTimeout(() => { el.classList.remove("in"); setTimeout(() => el.remove(), 250); }, 3200);
}
function atBottom() { return thread.scrollHeight - thread.scrollTop - thread.clientHeight < 90; }
function scrollDown(force) { if (force || atBottom()) thread.scrollTop = thread.scrollHeight; }
function hideWelcome() { if (welcome) { welcome.remove(); welcome = null; } }

async function loadTools() {
  try {
    const r = await fetch("/api/v1/agent/tools");
    const d = await r.json();
    const box = $("tools");
    box.innerHTML = "";
    d.tools.forEach((t) => {
      const row = document.createElement("div");
      row.className = "tool";
      row.innerHTML = ICON_TOOL;
      const span = document.createElement("div");
      const code = document.createElement("code");
      code.textContent = t.name;
      span.appendChild(code);
      const desc = document.createElement("div");
      desc.style.marginTop = "2px";
      desc.textContent = t.description;
      span.appendChild(desc);
      row.appendChild(span);
      box.appendChild(row);
    });
  } catch (e) {
    $("tools").innerHTML = '<div class="tool">无法读取工具列表</div>';
  }
}
async function loadSys() {
  try {
    const d = await (await fetch("/health")).json();
    $("sysInfo").textContent = d.tools ? d.tools.length + " 个工具已就绪" : "已连接";
  } catch (e) {
    $("sysInfo").textContent = "服务未就绪";
    document.querySelector(".dot").style.background = "var(--err)";
  }
}

function addUser(text) {
  hideWelcome();
  const el = document.createElement("div");
  el.className = "msg user";
  const b = document.createElement("div");
  b.className = "body";
  b.textContent = text;
  el.appendChild(b);
  msgs.appendChild(el);
  scrollDown(true);
}

function addBot() {
  const el = document.createElement("div");
  el.className = "msg bot";
  el.innerHTML = '<div class="who">' + ICON_BOT + "智能体</div>";

  const trace = document.createElement("div");
  trace.className = "trace collapsed";
  const head = document.createElement("div");
  head.className = "trace-head";
  head.innerHTML = ICON_TRACE + '<span class="trace-title">工具调用轨迹</span>';
  const body = document.createElement("div");
  body.className = "trace-body";
  trace.appendChild(head); trace.appendChild(body);

  const answer = document.createElement("div");
  answer.className = "answer pending";

  el.appendChild(trace); el.appendChild(answer);
  msgs.appendChild(el);
  head.onclick = () => trace.classList.toggle("collapsed");
  scrollDown(true);
  return { el, trace, traceBody: body, traceTitle: head.querySelector(".trace-title"), answer };
}

function newStep(ctx) {
  const step = document.createElement("div");
  step.className = "step";
  const think = document.createElement("div");
  think.className = "step-think";
  step.appendChild(think);
  ctx.traceBody.appendChild(step);
  ctx.trace.classList.remove("collapsed");
  return { step, think };
}

async function ask() {
  const text = q.value.trim();
  if (!text || streaming) return;
  hideWelcome();
  streaming = true; sendBtn.disabled = true;
  q.value = ""; autoGrow();
  addUser(text);
  const ctx = addBot();
  let answer = "";
  let current = newStep(ctx);

  try {
    const resp = await fetch("/api/v1/agent/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: text }),
    });
    if (!resp.ok || !resp.body) throw new Error("服务返回异常（" + resp.status + "）");

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        let evt;
        try { evt = JSON.parse(data); } catch (e) { continue; }

        if (evt.type === "step") {
          current = newStep(ctx);
        } else if (evt.type === "token") {
          current.think.textContent += evt.content;
          scrollDown(false);
        } else if (evt.type === "tool_call") {
          const call = document.createElement("div");
          call.className = "call";
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.innerHTML = ICON_TOOL;
          const code = document.createElement("code");
          code.textContent = evt.name;
          chip.appendChild(code);
          call.appendChild(chip);
          const args = document.createElement("span");
          args.style.color = "var(--text-3)";
          args.textContent = evt.arguments || "{}";
          call.appendChild(args);
          const result = document.createElement("div");
          result.className = "result";
          current.step.appendChild(call);
          current.step.appendChild(result);
          ctx._lastResult = result;
          ctx._lastChip = chip;
          scrollDown(false);
        } else if (evt.type === "tool_result") {
          if (ctx._lastResult) ctx._lastResult.textContent = evt.ok ? evt.result : (evt.error || "执行失败");
          if (ctx._lastChip) {
            ctx._lastChip.classList.add(evt.ok ? "ok" : "err");
            ctx._lastChip.innerHTML = (evt.ok ? ICON_OK : ICON_ERR);
            const code = document.createElement("code");
            code.textContent = evt.name;
            ctx._lastChip.appendChild(code);
          }
          scrollDown(false);
        } else if (evt.type === "final") {
          answer = evt.content;
          ctx.answer.innerHTML = fmt(answer);
          ctx.answer.classList.remove("pending");
          if (current.step && !current.step.querySelector(".call")) {
            current.step.remove();
          }
          const steps = ctx.traceBody.children.length;
          ctx.traceTitle.textContent = steps ? "工具调用轨迹（" + steps + " 步）" : "工具调用轨迹（未使用工具）";
          scrollDown(false);
        } else if (evt.type === "error") {
          ctx.el.classList.add("err");
          ctx.answer.textContent = (answer ? answer + "\n\n" : "") + "执行失败：" + evt.message;
          ctx.answer.classList.remove("pending");
        }
      }
    }
  } catch (err) {
    ctx.el.classList.add("err");
    ctx.answer.textContent = "请求失败：" + err.message;
    ctx.answer.classList.remove("pending");
  }
  ctx.answer.classList.remove("pending");
  streaming = false;
  sendBtn.disabled = q.value.trim() === "";
  scrollDown(true);
}

function autoGrow() {
  q.style.height = "auto";
  q.style.height = Math.min(q.scrollHeight, 160) + "px";
}

q.addEventListener("input", () => { autoGrow(); sendBtn.disabled = streaming || q.value.trim() === ""; });
q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); } });
sendBtn.onclick = ask;
const WELCOME_HTML = welcome ? welcome.outerHTML : "";

function bindExamples() {
  document.querySelectorAll(".example").forEach((b) => {
    b.addEventListener("click", () => { q.value = b.textContent; autoGrow(); sendBtn.disabled = false; q.focus(); });
  });
}

$("resetBtn").onclick = () => {
  msgs.innerHTML = "";
  if (!welcome && WELCOME_HTML) {
    const holder = document.createElement("div");
    holder.innerHTML = WELCOME_HTML;
    welcome = holder.firstElementChild;
    thread.insertBefore(welcome, msgs);
    bindExamples();
  }
  toast("对话已清空", "ok");
};

bindExamples();

loadTools();
loadSys();
q.focus();
</script>
</body>
</html>
